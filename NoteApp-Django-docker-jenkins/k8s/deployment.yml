apiVersion: apps/v1
kind: Deployment

metadata:
  name: notes-app-deployment
  labels:
    app: notes-app
  namespace: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notes-app

  template:
    metadata:
      labels:
        app: notes-app

    spec:
      containers:
      - name: notes-app
        image: mujtabas/notes-app-k8s
        imagePullPolicy: Always

        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /
            port: 8000  
